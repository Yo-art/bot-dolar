name: Chequear cotizacion dolar

on:
  schedule:
    - cron: "*/5 * * * *"    # cada 5 minutos
  workflow_dispatch:          # permite tambien correrlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  chequear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Ejecutar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_dolar_bot.py

      - name: Guardar el ultimo valor visto
        run: |
          git config user.name "dolar-bot"
          git config user.email "dolar-bot@users.noreply.github.com"
          git add ultima_cotizacion.json
          git diff --staged --quiet || git commit -m "Actualiza cotizacion"
          git push
